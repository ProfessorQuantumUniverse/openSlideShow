name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # No code-signing certificate in CI: build unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v6
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (src/**/*.js)
        shell: bash
        run: |
          status=0
          while IFS= read -r file; do
            node --check "$file" || status=1
          done < <(find src -name '*.js' -type f)
          exit $status

      - name: Build Windows installer (unsigned, no publish)
        run: npm run dist -- --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: OpenSlideShow-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 3
